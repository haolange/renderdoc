[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdx-mcp"
version = "1.0.0"
description = "RenderDoc GPU Debug MCP Server - Automated GPU debugging via Model Context Protocol"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.0",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyarrow>=14.0",
    "jinja2>=3.1",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
rdx-mcp = "rdx.server:main"
rdx = "rdx.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rdx*"]
